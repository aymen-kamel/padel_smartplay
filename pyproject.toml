[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartplay"
version = "0.1.0"
description = "Padel match analysis from a single fixed camera: point detection and score tracking."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["src/smartplay/ball/wasb_hrnet.py"]  # vendored third-party code, kept as is
